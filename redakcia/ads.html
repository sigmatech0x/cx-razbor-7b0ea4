<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Редакция CRYPTUS — Реклама</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#110E18; --side:#0D0B13; --raise:#1D1929; --hover:#241F33; --card:#15121D;
  --line:rgba(236,230,255,.075); --line2:rgba(236,230,255,.13);
  --text:#ECE8F4; --mute:#968FAA; --dim:#857E99;
  --violet:#9B47F5; --violet2:#B57BFF; --vsoft:rgba(155,71,245,.16);
  --ok:#43CF95; --warn:#EDB44E; --bad:#FF5E6E;
  --p-cifra:#2BCFC0; --p-coinw:#4C82FF; --p-konnex:#B8E35A; --p-zot:#FF6FA3; --p-bull:#FF8443;
  --ui:'Onest',system-ui,-apple-system,sans-serif; --disp:'Oswald','Onest',sans-serif;
  --tg:-apple-system,'SF Pro Text','Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#07060B;color:var(--text);font:13.5px/1.45 var(--ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--violet2);outline-offset:2px;border-radius:6px}
a{color:inherit}
img{display:block;max-width:100%}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2a2438;border-radius:10px;border:3px solid transparent;background-clip:padding-box}
.num{font-variant-numeric:tabular-nums}

.show{height:46px;display:flex;align-items:center;gap:14px;padding:0 16px;background:#07060B;border-bottom:1px solid var(--line)}
.show b{font-weight:600}
.show .what{color:var(--mute);font-size:12.5px;white-space:nowrap}
.show .sp{flex:1}
.refbtn{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:8px;border:1px solid var(--line2);font-size:12.5px;white-space:nowrap}
.refbtn[aria-pressed=true]{background:var(--vsoft);border-color:rgba(155,71,245,.5)}
.refbtn kbd{font:11px var(--ui);color:var(--dim);border:1px solid var(--line2);border-radius:4px;padding:0 5px}

.app{position:absolute;top:46px;left:0;right:0;bottom:0;display:grid;grid-template-columns:232px 1fr;background:var(--bg)}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:10px 8px;gap:2px;overflow:auto}
.ws{display:flex;align-items:center;gap:9px;padding:6px 8px 12px}
.ws .logo{width:24px;height:24px;border-radius:7px;background:linear-gradient(140deg,#B26BFF,#6E1FE0);display:grid;place-items:center;font:600 13px var(--disp);color:#fff}
.ws b{font-weight:600;font-size:13.5px}
.ws small{display:block;color:var(--dim);font-size:11.5px;margin-top:-2px}
.nav{display:flex;align-items:center;gap:10px;padding:6px 9px;border-radius:7px;color:#C9C3D6;width:100%;text-align:left}
.nav:hover{background:#17141f}
.nav[aria-current=page]{background:#1D1928;color:var(--text)}
.nav svg{width:16px;height:16px;flex:none;opacity:.8}
.nav .n{margin-left:auto;color:var(--dim);font-size:12px}
.nav .n.bad{color:var(--bad)}
.nav.off{opacity:.45;cursor:default}
.nav.off:hover{background:none}
.grp{color:var(--dim);font-size:12px;padding:16px 9px 6px}
.pdot{width:8px;height:8px;border-radius:3px;flex:none}
.me{margin-top:auto;display:flex;align-items:center;gap:9px;padding:10px 8px 4px;border-top:1px solid var(--line)}
.av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--ui);color:#fff;flex:none}
.me small{display:block;color:var(--dim);font-size:11.5px}
.main{position:relative;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.scr{display:none;flex:1;min-height:0;flex-direction:column}
.scr.on{display:flex}
.top{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--line)}
.top h1{font-size:15px;font-weight:600;white-space:nowrap}
.top .sp{flex:1}
.stamp{color:var(--dim);font-size:12px;white-space:nowrap}
.crumb{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13px;white-space:nowrap}
.crumb button{color:var(--mute)}
.crumb button:hover{color:var(--text)}
.crumb b{color:var(--text);font-weight:600}
.btn{text-decoration:none;display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:7px;border:1px solid var(--line2);background:var(--raise);font-size:12.5px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--violet);border-color:transparent;color:#fff;font-weight:500}
.btn.pri:hover{background:#A65AF8}
.btn.ghost{background:none;border-color:transparent;color:var(--mute)}
.btn.line{height:26px;padding:0 10px;background:none;border-color:rgba(181,123,255,.55);color:var(--violet2)}
.btn.line:hover{background:rgba(155,71,245,.12)}
.btn svg{width:14px;height:14px;flex:none}
.btn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.seg{display:flex;background:#15121d;border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{padding:4px 11px;border-radius:6px;font-size:12.5px;color:var(--mute);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--raise);color:var(--text)}
.chip{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;border-radius:20px;border:1px solid var(--line2);font-size:11.5px;color:#CFC9DC;white-space:nowrap}
.chip .d{width:6px;height:6px;border-radius:50%}
.chip.ok{color:var(--ok);border-color:rgba(67,207,149,.3)}
.chip.warn{color:var(--warn);border-color:rgba(237,180,78,.3)}
.chip.bad{color:var(--bad);border-color:rgba(255,94,110,.35)}
.chip.v{color:var(--violet2);border-color:rgba(155,71,245,.4);background:rgba(155,71,245,.08)}
.chip.mute{color:var(--mute)}
.mono{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font:700 10px var(--ui);color:#0d0b13;background:var(--c);flex:none}
.pi{width:16px;height:16px;flex:none;display:inline-grid;place-items:center;border-radius:4px;font:700 9px var(--ui)}
.pi.tg{background:#2AABEE;color:#fff}.pi.yt{background:#FF3D3D;color:#fff}.pi.x{background:#E7E7EA;color:#000}.pi.ig{background:linear-gradient(135deg,#F9CE34,#EE2A7B 55%,#6228D7);color:#fff}.pi.any{background:#3a3349;color:var(--text)}
.badge{display:inline-flex;align-items:center;gap:5px;height:19px;padding:0 6px 0 3px;border-radius:6px;font-size:10.5px;white-space:nowrap;background:color-mix(in srgb,var(--c) 16%,#15121d);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);color:#F0ECF8}
.badge .mono{width:13px;height:13px;font-size:8px;border-radius:3px}
.pbar{height:8px;border-radius:5px;background:#231E31;position:relative}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--c)}
.pbar i.pend{background:repeating-linear-gradient(135deg,var(--c) 0 2px,transparent 2px 5px)}
.pbar b{position:absolute;top:-4px;bottom:-4px;width:2px;background:#E8E3F3;border-radius:1px;opacity:.55}
.pbar.unk{background:none;border:1px dashed var(--line2)}
.pbar.unk i:not(.pend){display:none}
.wrap{flex:1;overflow:auto}
.wrap-in{max-width:1240px;margin:0 auto;padding:18px 22px 60px}

/* сводка */
.sum{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line2);border-radius:14px;overflow:hidden;background:var(--card)}
.sum>div{padding:14px 16px;border-left:1px solid var(--line)}
.sum>div:first-child{border-left:0}
.sum .lb{font-size:12.5px;color:var(--mute)}
.sum .big{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin-top:6px;display:flex;align-items:baseline;gap:8px}
.sum .big small{font-size:13px;font-weight:500;color:var(--violet2);letter-spacing:0}
.sum .sub{font-size:12px;color:var(--mute);margin-top:4px}
.sum .who{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.attn{margin-top:12px;border:1px solid var(--line2);border-radius:14px;background:var(--card);overflow:hidden}
.attn h3{font-size:12.5px;font-weight:600;color:var(--mute);padding:11px 16px 9px;display:flex;gap:8px}
.ar{display:grid;grid-template-columns:22px 150px 1fr auto;gap:12px;align-items:center;padding:9px 16px;border-top:1px solid var(--line);font-size:13px}
.ar .why{color:#D6D0E2}
.ar .why small{color:var(--mute);font-size:12px;margin-left:6px}
.ar .dotx{width:8px;height:8px;border-radius:50%;margin-left:7px}
.gh{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px}
.gh h2{font-size:14px;font-weight:600}
.gh span{color:var(--mute);font-size:12.5px}
.cards{display:grid;gap:12px}
.cards.two{grid-template-columns:1fr 1fr}
.cards.three{grid-template-columns:repeat(3,1fr)}
.pc{border:1px solid var(--line2);border-radius:14px;background:var(--card);padding:15px 16px 13px;text-align:left;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;transition:border-color .15s}
.pc:hover{border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.pc:before{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:var(--c);opacity:.8}
.pc .hd{display:flex;align-items:center;gap:9px}
.pc .hd b{font-size:15px;font-weight:600}
.pc .hd .sp{flex:1}
.pc .hd .dl{color:var(--mute);font-size:12px}
.pc .kind{font-size:12px;color:var(--mute);margin-top:-4px}
.pc .tot{display:flex;align-items:baseline;gap:8px}
.pc .tot b{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1}
.pc .tot span{color:var(--mute);font-size:13px}
.pc .tot .r{margin-left:auto}
.chs{display:grid;gap:7px}
.chr{display:grid;grid-template-columns:18px 92px 1fr 48px;gap:9px;align-items:center;font-size:12.5px}
.chr .pbar{height:6px}
.chr .v{text-align:right;font-weight:600;font-size:12.5px}
.chr .v small{color:var(--mute);font-weight:400}
.pc .ft{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-top:9px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
.pc .ft .sp{flex:1}
.pc .ft .go{color:var(--violet2)}
.pc.zero .zbox{border:1px dashed var(--line2);border-radius:10px;padding:14px;color:var(--mute);font-size:12.5px;line-height:1.5}

/* карточка проекта */
.pgrid{display:grid;grid-template-columns:1.45fr 1fr;gap:14px}
.box{border:1px solid var(--line2);border-radius:14px;background:var(--card);padding:15px 16px 14px}
.box h3{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.box h3 small{font-weight:400;color:var(--mute);font-size:12px}
.box h3 .sp{flex:1}
.hero{display:flex;align-items:flex-end;gap:14px;margin-bottom:14px}
.hero b{font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:.95}
.hero span{color:var(--mute);font-size:13px;line-height:1.35}
.hero .r{margin-left:auto;text-align:right}
.bigbar{height:10px;border-radius:6px;margin-bottom:16px}
.chr.l{grid-template-columns:20px 110px 1fr 64px 150px;padding:9px 0;border-top:1px solid var(--line)}
.chr.l .pbar{height:8px}
.chr.l .lf{font-size:12px;color:var(--mute);text-align:right}
.chr.l .lf.ok{color:var(--ok)}
.chr.l .sb{grid-column:2/6;font-size:11.5px;color:var(--mute);margin-top:-3px}
.legend{display:flex;gap:14px;margin-top:10px;font-size:11.5px;color:var(--dim)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:6px;border-radius:3px;display:inline-block}
.terms{display:grid;gap:9px;font-size:13px;line-height:1.5;color:#D8D2E4}
.terms div{display:grid;grid-template-columns:16px 1fr;gap:8px}
.terms div:before{content:'';width:6px;height:6px;border-radius:50%;background:var(--c);margin-top:8px}
.terms .q{color:var(--warn)}
.kpi{padding:8px 0;border-top:1px solid var(--line)}
.kpi .r{display:flex;align-items:baseline;gap:8px}
.kpi .r b{font-size:19px;font-weight:600}
.kpi .r small{color:var(--mute)}
.kpi .r .chip{margin-left:auto}
.kpi .pbar{margin-top:6px;height:6px}
.hist{width:100%;border-collapse:collapse;font-size:12.5px}
.hist th{font-weight:500;color:var(--mute);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line2);font-size:12px}
.hist th.n,.hist td.n{text-align:right;font-variant-numeric:tabular-nums}
.hist td{padding:9px 8px;border-bottom:1px solid var(--line)}
.hist tr.cur td{background:rgba(155,71,245,.06)}
.hist .ok{color:var(--ok)}.hist .lag{color:var(--warn)}
.hist small{color:var(--mute)}
.left{display:grid;gap:8px}
.left div{display:flex;align-items:center;gap:9px;font-size:13px}
.left div b{margin-left:auto;font-weight:600}
.setn{display:flex;gap:8px;align-items:center;margin-top:12px;padding:11px 12px;border-radius:10px;background:rgba(237,180,78,.07);border:1px solid rgba(237,180,78,.25);font-size:12.5px;color:#E8D6B0}
.setn input{width:52px;height:28px;border-radius:7px;border:1px solid var(--line2);background:#110F17;text-align:center;font-weight:600}
.setn .sp{flex:1}
.note{display:flex;gap:9px;padding:10px 12px;border-radius:10px;background:rgba(255,94,110,.06);border:1px solid rgba(255,94,110,.28);font-size:12.5px;color:#F0D3D7;margin-top:12px}
.note.w{background:rgba(237,180,78,.07);border-color:rgba(237,180,78,.25);color:#E8D6B0}

.lhead{display:flex;align-items:center;gap:10px;margin:18px 0 10px}
.lhead h3{font-size:13px;font-weight:600}
.lhead .sp{flex:1}
.tbl{border:1px solid var(--line2);border-radius:14px;overflow:hidden;background:var(--card)}
.lr{display:grid;grid-template-columns:70px 150px 1fr 120px 74px 96px;gap:12px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);font-size:12.5px}
.lr.h{color:var(--mute);font-size:11.5px;padding:8px 14px;background:#13101B;border-top:0}
.lr .ttl{display:flex;align-items:center;gap:10px;min-width:0}
.lr .ttl img{width:64px;height:36px;border-radius:5px;object-fit:cover;flex:none;border:1px solid var(--line)}
.tgph{width:64px;height:36px;border-radius:5px;flex:none;background:#17212B;display:grid;place-items:center;color:#6AB2F2;font:600 11px var(--tg);border:1px solid var(--line)}
.tgph.xt{background:#000;color:#fff;font:600 15px var(--tg)}
.tgph.igt{background:linear-gradient(135deg,#F9CE34,#EE2A7B 55%,#6228D7);color:#fff;font-size:16px}
.lr .t1{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr .also{display:flex;gap:4px;margin-top:3px}
.lr a.lnk{color:#8FB8FF;text-decoration:none;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr a.lnk:hover{text-decoration:underline}
.lr .who{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:12px}
.lr.pend{background:rgba(155,71,245,.05)}
.lr.fresh{background:rgba(67,207,149,.05)}
.lgroup{padding:9px 14px;border-top:1px solid var(--line);background:#13101B;font-size:12px;font-weight:600;color:#D8D2E4;display:flex;gap:10px;align-items:baseline}
.lgroup span{font-weight:400;color:var(--mute)}
.empty{padding:22px 16px;text-align:center;color:var(--mute);font-size:13px;border-top:1px solid var(--line)}
.empty b{color:var(--text);font-weight:500}
.empty .acts{display:flex;gap:8px;justify-content:center;margin-top:12px}

/* шторка Telegram, модалки, отчёт */
.scrim{position:fixed;inset:46px 0 0 0;background:rgba(5,4,9,.6);opacity:0;pointer-events:none;transition:opacity .25s;z-index:39}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:46px;right:0;bottom:0;width:min(720px,94vw);background:#0F0D15;border-left:1px solid var(--line2);box-shadow:-30px 0 60px rgba(0,0,0,.55);transform:translateX(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:40;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dhead{padding:16px 20px 12px;border-bottom:1px solid var(--line)}
.dhead h2{font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px}
.dhead h2 button{margin-left:auto}
.dhead p{color:var(--mute);font-size:12.5px;margin-top:4px}
.dbody{flex:1;overflow:auto;padding:0 0 30px}
.tgroup{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;padding:10px 20px;font-size:12px;font-weight:600;color:#D8D2E4;background:#13101B;border-bottom:1px solid var(--line)}
.tgroup span{font-weight:400;color:var(--mute)}
.tgroup.tog{border-top:1px solid var(--line)}
.tgroup.tog:hover{background:#18141F}
.tp{display:grid;grid-template-columns:62px 1fr auto;gap:12px;padding:11px 20px;border-bottom:1px solid var(--line);align-items:start}
.tp .dt{color:var(--mute);font-size:12px;line-height:1.3}
.tp .dt b{display:block;color:var(--text);font-weight:500;font-size:12.5px}
.tp .tt{font-size:13px;font-weight:500;line-height:1.35}
.tp .tgs{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tp .why{font-size:12px;color:var(--mute);margin-top:6px;line-height:1.45}
.tp .why code{font:11.5px ui-monospace,Menlo,monospace;color:#C9B8F5;background:#1C1828;border-radius:4px;padding:1px 5px}
.tp .ac{display:flex;gap:6px;align-items:center}
.tp.sug{background:rgba(155,71,245,.05)}
.tp.done{opacity:.65}
.tp .vw{color:var(--dim);font-size:12px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%);opacity:0;pointer-events:none;width:min(560px,94vw);max-height:88vh;overflow:auto;background:#17141F;border:1px solid var(--line2);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.6);z-index:45;transition:.22s}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal .mh{display:flex;align-items:center;gap:10px;padding:16px 18px 0}
.modal .mh h2{font-size:16px;font-weight:600}
.modal .mh .seg{margin-left:auto}
.modal .mb{padding:14px 18px 18px}
.modal p.t{color:#D6D0E2;font-size:13px;line-height:1.55}
.urlin{display:flex;align-items:center;gap:10px;border:1px solid var(--line2);background:#110F17;border-radius:11px;padding:0 12px;height:44px}
.urlin:focus-within{border-color:var(--violet2)}
.urlin input{flex:1;background:none;border:0;outline:0;font-size:14px}
.urlin svg{width:16px;height:16px;color:var(--mute);flex:none}
.examples{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--dim);align-items:center}
.examples button{color:#8FB8FF;font-size:12px}
.det{margin-top:14px;border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.det .dtop{display:flex;gap:12px;padding:12px;background:#1B1726;align-items:center}
.det .dtop img,.det .dtop .tgph{width:96px;height:54px;border-radius:7px;object-fit:cover;flex:none}
.det .dtop b{font-size:13.5px;font-weight:600;display:block;line-height:1.3}
.det .dtop small{color:var(--mute);font-size:12px}
.fld{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);font-size:12.5px}
.fld>span:first-child{color:var(--mute)}
.fld .auto{color:var(--ok);font-size:11px;margin-left:6px}
.opts{display:flex;gap:5px;flex-wrap:wrap}
.opt{height:26px;padding:0 10px;border-radius:7px;border:1px solid var(--line2);font-size:12px;display:inline-flex;align-items:center;gap:6px;color:#CFC9DC}
.opt[aria-pressed=true]{border-color:var(--violet2);background:rgba(155,71,245,.14);color:#fff}

function suggest(t) {

  const ext = t.links.filter(l => !/coinw\.com\/[^ ]*register\?r=/.test(l));
  if (ext.some(l => /coinw\.com/.test(l)) && /event|lucky|promo/.test(ext.join(' '))) out.push({p:'coinw', type:'native_tg', why:['ссылка на акцию <code>coinw.com/…/event/lucky-draw</code>', 'в тексте «На бирже CoinW можно получить…»'], conf:'высокая'});

  $('#rdrawer').innerHTML = `<h2>Эталон: ${r.t}</h2><p class="lead">Строили по этим экранам. Что взяли и что добавили своё:</p>${r.src.map(([s, c]) => `<figure><img src="${SRC(s)}" alt="${esc(c)}"><figcaption>${esc(c)}</figcaption></figure>`).join('')}
    <div class="took">${r.took.map(([a, b]) => `<div class="${a === 'Своё' ? 'own' : ''}"><span>${a}</span><span>${esc(b)}</span></div>`).join('')}</div>
    <div class="honest"><b>Настоящее:</b> снимок панели CRYPTUS ${esc(O.snap)} (только чтение) — публикации и KPI CoinW, интеграции Цифры, кампания Konnex; посты канала 7–17 ноября из ленты t.me/s/CRYPTUS_MEDIA; Bullshot и ZOT — из договорённостей в волте.<br><b>Пример:</b> «Кто внёс: Андрей» у новых записей; кнопки «Обновить», «Засчитать», «Новый месяц», «Скопировать ссылку» в образце ничего не сохраняют. Цен и сумм договоров нет нигде.</div>`;
}
function setDev(d) {
  $$('#devSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.dev === d));
  if (d === 'mob') { $$('.scr').forEach(s => s.classList.remove('on')); $('#v-mob').classList.add('on'); drawerFor('mob'); }
  else { $('#v-mob').classList.remove('on'); (cur_view === 'proj' ? $('#v-proj') : $('#v-list')).classList.add('on'); drawerFor(cur_view === 'proj' ? 'proj' : 'list'); }
}
$$('#devSeg button').forEach(b => b.onclick = () => setDev(b.dataset.dev));
function toggleRef() { const on = !$('#rdrawer').classList.contains('on'); closeAll(); $('#rdrawer').classList.toggle('on', on); $('#scrim').classList.toggle('on', on); $('#refToggle').setAttribute('aria-pressed', on); }
$('#refToggle').onclick = toggleRef;
document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === 'e' || e.key === 'E' || e.key === 'у' || e.key === 'У') toggleRef();
  if (e.key === 'Escape') { closeAll(); $('#report').classList.remove('on'); }
});
let tt; function toast(m, dr) { const t = $('#toast'); t.textContent = m; t.classList.toggle('dr', !!dr); t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2400); }
function renderAll() { renderList(); if (cur_view === 'proj') renderProj(); renderMob(); }

$('#stamp').textContent = `данные на ${O.coinw.updated.replace('.2026', '')}`;
$('#stamp').title = `панель CRYPTUS — ${O.coinw.updated}, канал — ${O.snap}`;
renderAll(); drawerFor('list');
const hash = location.hash.slice(1);
if (P[hash]) openProj(hash); else if (hash === 'mob') setDev('mob');
</script>
</body>
</html>
