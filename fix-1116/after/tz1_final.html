<div class="scrim"></div><div class="foot"><div class="title"></div></div>
<script>
// подгоняем кегль: самая длинная строка = ширина бокса, все строки влезают по высоте
document.fonts.ready.then(()=>{
  const box=document.getElementById('head'); const W=box.clientWidth, H=box.clientHeight;
  let lo=10, hi=900;
  for(let k=0;k<30;k++){ const m=(lo+hi)/2; box.style.fontSize=m+'px';
    const fit=[...box.children].every(c=>c.scrollWidth<=W) && box.scrollHeight<=H; if(fit) lo=m; else hi=m; }
  box.style.fontSize=lo+'px';
  const hm=document.getElementById('hm'), bx=document.getElementById('box');
  if(!hm||!bx){document.body.dataset.ready='1';return;}
  const go=()=>{ // рамка слежения по маске героя (кадр растянут как object-fit:cover)
    const W2=1600,H2=900,iw=hm.naturalWidth,ih=hm.naturalHeight,k=Math.max(W2/iw,H2/ih),ox=(W2-iw*k)/2,oy=(H2-ih*k)/2;
    const c=document.createElement('canvas');c.width=iw;c.height=ih;const g=c.getContext('2d');g.drawImage(hm,0,0);
    const d=g.getImageData(0,0,iw,ih).data;let x0=iw,y0=ih,x1=0,y1=0;
    for(let y=0;y<ih;y+=2)for(let x=0;x<iw;x+=2){if(d[(y*iw+x)*4+3]>60){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}}
    if(x1>x0){const p=0.03*W2;let L=ox+x0*k-p,T=oy+y0*k-p,R=ox+x1*k+p,B=oy+y1*k+p;
      L=Math.max(L,20);T=Math.max(T,60);R=Math.min(R,W2-20);B=Math.min(B,H2-40);
      Object.assign(bx.style,{display:'block',left:L+'px',top:T+'px',width:(R-L)+'px',height:(B-T)+'px'});}
    document.body.dataset.ready='1';};
  hm.complete?go():hm.onload=go;
});
</script></body></html>
